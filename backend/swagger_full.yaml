openapi: 3.0.0
info:
  title: VyaपारAI Backend API
  description: API documentation for VyaपारAI backend routes handling authentication, inventory, dashboard, billing, notes, todos, and credits.
  version: "1.0.0"
servers:
  - url: http://localhost:5001
    description: Development Server (localhost)
  - url: http://127.0.0.1:5001
    description: Development Server (127.0.0.1)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # ==========================================
  # AUTHENTICATION ROUTES
  # ==========================================
  /api/auth/signup:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, full_name]
              properties:
                username:
                  type: string
                  minLength: 3
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Username or email already exists
        '500':
          description: Server error

  /api/auth/signin:
    post:
      summary: Authenticate user and return JWT tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username_or_email, password]
              properties:
                username_or_email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '400':
          description: Missing credentials
        '401':
          description: Invalid credentials
        '500':
          description: Server error

  /api/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      tags: [Auth]
      security:
        - refreshAuth: []
      responses:
        '200':
          description: Token refreshed successfully
        '500':
          description: Token refresh failed

  /api/auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /api/auth/profile:
    get:
      summary: Get current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
        '404':
          description: User not found
    put:
      summary: Update user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/auth/change-password:
    post:
      summary: Change user password
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed successfully

  /api/auth/users:
    get:
      summary: Get all users (Admin only)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
        '403':
          description: Unauthorized access

  /api/auth/verify-token:
    get:
      summary: Verify if the current token is valid
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Invalid token

  /api/auth/cashiers:
    get:
      summary: Get all cashiers
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cashiers retrieved successfully
    post:
      summary: Create a new cashier (Owner only)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, username, email, password]
              properties:
                full_name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Cashier created
        '403':
          description: Unauthorized

  /api/auth/cashiers/{username}:
    delete:
      summary: Delete a cashier (Owner/Admin only)
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cashier deleted successfully
        '400':
          description: Invalid request (e.g., trying to delete self or non-cashier)
        '403':
          description: Unauthorized. Owner/Admin access required
        '404':
          description: Cashier or user not found

  # ==========================================
  # INVENTORY ROUTES
  # ==========================================
  /api/inventory/products:
    get:
      summary: Get all products for the logged-in user's inventory
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Products fetched successfully
        '404':
          description: Inventory not found

  /api/inventory/low-stock:
    get:
      summary: Get low stock items
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Low stock items retrieved successfully

  /api/inventory/stats:
    get:
      summary: Get inventory statistics for dashboard
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics retrieved successfully

  /api/inventory/restock-recommendations:
    get:
      summary: Get restock recommendations
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recommendations retrieved successfully

  # ==========================================
  # DASHBOARD ROUTES
  # ==========================================
  /api/dashboard/stats:
    get:
      summary: Get comprehensive dashboard statistics
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats fetched successfully

  # ==========================================
  # BILLING ROUTES
  # ==========================================
  /api/billing/products:
    get:
      summary: Search products
      tags: [Billing]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query for products
      responses:
        '200':
          description: Products matched string

  /api/billing/check-customer:
    get:
      summary: Check if a customer has unresolved credit
      tags: [Billing]
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
        '400':
          description: Missing customer name

  /api/billing/create:
    post:
      summary: Create a new bill/sale
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                customer_phone:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      product_name:
                        type: string
                      units:
                        type: integer
                      unit_price:
                        type: number
                total_cost:
                  type: number
                amount_paid:
                  type: number
                payment_method:
                  type: string
                due_date:
                  type: string
                  format: date
                previous_sale_id:
                  type: integer
      responses:
        '200':
          description: Bill created successfully
        '400':
          description: Invalid input

  # ==========================================
  # NOTES ROUTES
  # ==========================================
  /api/notes:
    get:
      summary: Get all notes for the logged-in user
      tags: [Notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notes retrieved successfully
    post:
      summary: Create a new note
      tags: [Notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Note created successfully

  /api/notes/{note_id}:
    delete:
      summary: Delete a note
      tags: [Notes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note deleted successfully
        '404':
          description: Note not found

  # ==========================================
  # TODOS ROUTES
  # ==========================================
  /api/todos:
    get:
      summary: Get all todos for the logged-in user
      tags: [Todos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todos retrieved successfully
    post:
      summary: Create a new todo
      tags: [Todos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date
                time:
                  type: string
                priority:
                  type: string
                category:
                  type: string
                completed:
                  type: boolean
      responses:
        '201':
          description: Todo created successfully

  /api/todos/{todo_id}:
    put:
      summary: Update an existing todo
      tags: [Todos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todo_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date
                time:
                  type: string
                priority:
                  type: string
                category:
                  type: string
                completed:
                  type: boolean
      responses:
        '200':
          description: Todo updated
    delete:
      summary: Delete a todo
      tags: [Todos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todo_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Todo deleted

  /api/todos/{todo_id}/toggle:
    patch:
      summary: Toggle todo completion status
      tags: [Todos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todo_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status toggled

  # ==========================================
  # CREDIT ROUTES
  # ==========================================
  /api/credits/dashboard:
    get:
      summary: Get credit dashboard statistics
      tags: [Credits]
      responses:
        '200':
          description: Dashboard stats retrieved successfully

  /api/credits/search:
    get:
      summary: Search credit customers by name
      tags: [Credits]
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/credits/clear/{sale_id}:
    put:
      summary: Clear or update a credit (outstanding balance)
      tags: [Credits]
      parameters:
        - in: path
          name: sale_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_paid]
              properties:
                amount_paid:
                  type: number
                new_due_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Credit updated successfully
        '400':
          description: Invalid amount or input

  # ==========================================
  # CHATBOT ROUTES
  # ==========================================
  /api/chatbot/chat:
    post:
      summary: Public chatbot response using RAG knowledge base
      tags: [Chatbot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
      responses:
        '200':
          description: Chat response generated successfully
        '400':
          description: No data/question provided
        '500':
          description: Chat processing failed

  /api/chatbot/user-chat:
    post:
      summary: Authenticated owner/user chatbot with DB-backed analytics
      tags: [Chatbot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
      responses:
        '200':
          description: Personalized chat response generated successfully
        '400':
          description: No data/question provided
        '401':
          description: Missing or invalid JWT token
        '500':
          description: User chat processing failed

  /api/chatbot/health:
    get:
      summary: Health check for chatbot service
      tags: [Chatbot]
      responses:
        '200':
          description: Chatbot service healthy

  /api/chatbot/history:
    get:
      summary: Get chatbot history placeholder response
      tags: [Chatbot]
      responses:
        '200':
          description: History placeholder returned
        '500':
          description: Failed to fetch history

