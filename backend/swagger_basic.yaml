openapi: 3.0.0
info:
  title: VyaपारAI Basic CRUD API
  description: Barebones API documentation focusing strictly on essential CRUD operations and their dependencies (Auth, Profile, Cashiers, Notes, and Todos).
  version: "1.0.0"
servers:
  - url: http://localhost:5001
    description: Development Server (localhost)
  - url: http://127.0.0.1:5001
    description: Development Server (127.0.0.1)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # ==========================================
  # AUTHENTICATION & PROFILE (Base Dependencies)
  # ==========================================
  /api/auth/signup:
    post:
      summary: Create a new user (Signup)
      description: |
          User Story:
          As a user, I want to create an account so that I can access and manage store operations.

          API Mapping:
          - Input: full_name, username, email, password
          - Output: User created (201)
      tags: [Auth & Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, username, email, password]
              properties:
                full_name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/auth/signin:
    post:
      summary: Authenticate user (Login to get Token)
      description: |
          User Story:
          As a user, I want to log into the system so that I can securely access my data.

          API Mapping:
          - Input: username_or_email, password
          - Output: Authentication token (200)
      tags: [Auth & Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username_or_email, password]
              properties:
                username_or_email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful, returns Bearer token

  /api/auth/profile:
    get:
      summary: Read current user profile
      tags: [Auth & Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
    put:
      summary: Update user profile
      tags: [Auth & Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Profile updated

  # ==========================================
  # CASHIERS (Resource explicitly requiring Auth)
  # ==========================================
  /api/auth/cashiers:
    get:
      summary: Read all cashiers
      tags: [Cashiers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of cashiers
    post:
      summary: Create a new cashier
      description: |
        User Story:
        As a retailer, I want to manage staff accounts so that I can delegate store operations.

        API Mapping:
        - Input: full_name, username, email, password
        - Output: Cashier created (200/201)
      tags: [Cashiers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, username, email, password]
              properties:
                full_name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Cashier created

  # ==========================================
  # NOTES (Standard CRUD)
  # ==========================================
  /api/notes:
    get:
      summary: Read all notes
      tags: [Notes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of notes
    post:
      summary: Create a new note
      description: |
        User Story:
        As a store staff member, I want to record important information so that I can manage tasks efficiently.

        API Mapping:
        - Input: text
        - Output: Note created (201)
      tags: [Notes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Note created

  /api/notes/{note_id}:
    delete:
      summary: Delete a note
      tags: [Notes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note deleted

  # ==========================================
  # TODOS (Standard CRUD)
  # ==========================================
  /api/todos:
    get:
      summary: Read all todos
      tags: [Todos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of todos
    post:
      summary: Create a new todo
      description: |
        User Story:
        As a staff member, I want to track daily tasks so that I can manage work efficiently.

        API Mapping:
        - Input: title, date
        - Output: Todo created (201)
      tags: [Todos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title:
                  type: string
                date:
                  type: string
      responses:
        '201':
          description: Todo created

  /api/todos/{todo_id}:
    put:
      summary: Update a todo
      tags: [Todos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todo_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                completed:
                  type: boolean
      responses:
        '200':
          description: Todo updated
    delete:
      summary: Delete a todo
      tags: [Todos]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: todo_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Todo deleted